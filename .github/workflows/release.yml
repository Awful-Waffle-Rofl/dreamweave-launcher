name: release

# Tag push v*.*.* builds the exe and the setup installer and creates a DRAFT GitHub Release (never published by CI).
# workflow_dispatch is a dry run: it runs every check and builds the assets, but creates no release.
#
# Code signing (Azure Artifact Signing) is inert until the repo variable ARTIFACT_SIGNING_ACCOUNT is set; see
# Docs/release-runbook.md ("Code signing setup") and Docs/code-signing-policy.md. Exactly one of package-unsigned and
# package-signed runs. Only package-signed uses the GitHub environment `signing` (owner approval per run) and the
# OIDC token, so an unconfigured repo never needs the environment and keeps producing unsigned releases.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run against, for example v1.0.0 (no release is created)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DreamWeaveLauncher.sln

      - name: Build
        run: dotnet build DreamWeaveLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test DreamWeaveLauncher.sln -c Release --no-build

      # Stages exactly the shipped files (never the pdbs) for the package jobs.
      - name: Check build output against installer/shipped-files.txt
        shell: pwsh
        run: ./tools/release/check-build-output.ps1 -StageDir launcher-bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-bin
          path: launcher-bin
          if-no-files-found: error

  package-unsigned:
    needs: build
    if: vars.ARTIFACT_SIGNING_ACCOUNT == ''
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher-bin
          path: launcher-bin

      - uses: ./.github/actions/package-release
        with:
          sign: 'false'
          tag: ${{ env.TAG }}

  package-signed:
    needs: build
    if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
    runs-on: windows-latest
    # The environment `signing` has the owner as required reviewer: every signing run waits for approval, and the
    # Azure federated credential trusts only this environment's subject.
    environment: signing
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher-bin
          path: launcher-bin

      - uses: ./.github/actions/package-release
        with:
          sign: 'true'
          tag: ${{ env.TAG }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          signing-endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          signing-profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}

  draft-release:
    needs: [package-unsigned, package-signed]
    # Exactly one package job ran; the other was skipped. A failed or rejected signing run blocks the release.
    if: github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Verify SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/DreamWeaveLauncher-Setup.exe release-assets/SHA256SUMS \
            --draft --verify-tag --title "DreamWeave Launcher $TAG" \
            --notes "Draft. Follow Docs/release-runbook.md before publishing: verify SHA256SUMS, update and sign the manifest, then publish."
