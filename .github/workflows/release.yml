name: release

# Tag push v*.*.* builds the exe and the setup installer and creates a DRAFT GitHub Release (never published by CI).
# workflow_dispatch is a dry run: it runs every check and builds the assets, but creates no release.
#
# Code signing (SignPath Foundation) is inert until the repo variable SIGNPATH_ORGANIZATION_ID is set; see
# Docs/release-runbook.md ("Code signing setup") and Docs/code-signing-policy.md. Exactly one of package-unsigned and
# package-signed runs. Only package-signed uses the GitHub environment `signing`, which holds the SIGNPATH_API_TOKEN
# secret, so an unconfigured repo never needs the environment and keeps producing unsigned releases. SignPath itself
# enforces the manual approval of every signing request.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run against, for example v1.0.0 (no release is created)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DreamWeaveLauncher.sln

      - name: Build
        run: dotnet build DreamWeaveLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test DreamWeaveLauncher.sln -c Release --no-build

      # Stages exactly the shipped files (never the pdbs) for the package jobs.
      - name: Check build output against installer/shipped-files.txt
        shell: pwsh
        run: ./tools/release/check-build-output.ps1 -StageDir launcher-bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-bin
          path: launcher-bin
          if-no-files-found: error

  # Runs before any signing approval prompt can appear: a tag whose commit is not on main must never reach the
  # `signing` environment. A dispatch has no tag, so this job is skipped for it.
  verify-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

  package-unsigned:
    needs: [build, verify-tag]
    if: >-
      vars.SIGNPATH_ORGANIZATION_ID == '' && !cancelled() && needs.build.result == 'success'
      && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher-bin
          path: launcher-bin

      - uses: ./.github/actions/package-release
        with:
          sign: 'false'
          tag: ${{ env.TAG }}

  package-signed:
    needs: [build, verify-tag]
    if: >-
      vars.SIGNPATH_ORGANIZATION_ID != '' && !cancelled() && needs.build.result == 'success'
      && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: windows-latest
    # The environment `signing` holds the SIGNPATH_API_TOKEN secret, so only this job can read it. SignPath requires a
    # human to approve each request and the action waits for that (up to 3600 s per pass, two passes), so the job
    # timeout must outlast two approvals.
    environment: signing
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher-bin
          path: launcher-bin

      - uses: ./.github/actions/package-release
        with:
          sign: 'true'
          tag: ${{ env.TAG }}
          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signpath-organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          signpath-project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signpath-signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          signpath-artifact-config-binaries: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_BINARIES }}
          signpath-artifact-config-setup: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SETUP }}

  draft-release:
    needs: [package-unsigned, package-signed]
    # Exactly one package job ran; the other was skipped. Needs an explicit success, so a failed or rejected
    # signing run, or a skipped chain, never creates a release.
    if: >-
      github.event_name == 'push' && !cancelled()
      && (needs.package-signed.result == 'success' || needs.package-unsigned.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Verify SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/DreamWeaveLauncher-Setup.exe release-assets/SHA256SUMS \
            --draft --verify-tag --title "DreamWeave Launcher $TAG" \
            --notes "Draft. Follow Docs/release-runbook.md before publishing: verify SHA256SUMS, update and sign the manifest, then publish. Code signing policy: https://github.com/Awful-Waffle-Rofl/dreamweave-launcher/blob/main/Docs/code-signing-policy.md"
