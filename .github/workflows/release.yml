name: release

# Tag push v*.*.* builds the exe and the setup installer and creates a DRAFT GitHub Release (never published by CI).
# workflow_dispatch is a dry run: it runs every check and builds the assets, but creates no release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run against, for example v1.0.0 (no release is created)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DreamWeaveLauncher.sln

      - name: Build
        run: dotnet build DreamWeaveLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test DreamWeaveLauncher.sln -c Release --no-build

      - name: Check build output against installer/shipped-files.txt
        shell: pwsh
        run: ./tools/release/check-build-output.ps1

      # Inno Setup 6 is preinstalled on the Windows runners; the script logs the exact version it used.
      - name: Build setup installer
        shell: pwsh
        run: ./tools/release/build-setup.ps1 -ExePath $env:EXE_PATH -OutDir setup-out

      - name: Assert tag equals assembly and setup version
        shell: pwsh
        run: |
          $found = Get-ChildItem setup-out -Filter 'DreamWeaveLauncher-Setup-*.exe' | Select-Object -First 1
          if (-not $found) { throw 'No setup exe found in setup-out' }
          $setup = $found.FullName
          ./tools/release/assert-version.ps1 -Tag $env:TAG -ExePath $env:EXE_PATH -SetupPath $setup

      - name: Package release assets
        shell: pwsh
        run: |
          $found = Get-ChildItem setup-out -Filter 'DreamWeaveLauncher-Setup-*.exe' | Select-Object -First 1
          if (-not $found) { throw 'No setup exe found in setup-out' }
          $setup = $found.FullName
          ./tools/release/package-release.ps1 -SetupPath $setup -OutDir release-assets

      # Code signing is not done in v1: the launcher ships UNSIGNED. Signing is planned through
      # SignPath Foundation (https://signpath.org/) once the application is approved; see
      # Docs/code-signing-policy.md. When approved, sign here, BEFORE build-setup.ps1 (the setup
      # packs the exe, Launcher.Core.dll and DreamWeaveDecalLaunch.exe, so they must already be signed) and so SHA256SUMS covers the signed setup installer. Do not add any manifest-signing key to CI.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@<full commit sha>
      #   with: { ... }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  draft-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Verify SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/DreamWeaveLauncher-Setup-*.exe release-assets/SHA256SUMS \
            --draft --verify-tag --title "DreamWeave Launcher $TAG" \
            --notes "Draft. Follow Docs/release-runbook.md before publishing: verify SHA256SUMS, update and sign the manifest, then publish."
