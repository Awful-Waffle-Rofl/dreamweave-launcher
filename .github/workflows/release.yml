name: release

# Tag push v*.*.* builds the exe and creates a DRAFT GitHub Release (never published by CI).
# workflow_dispatch is a dry run: it runs every check and builds the assets, but creates no release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run against, for example v1.0.0 (no release is created)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore DreamWeaveLauncher.sln

      - name: Build
        run: dotnet build DreamWeaveLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test DreamWeaveLauncher.sln -c Release --no-build

      - name: Check exe size and no unembedded files
        shell: pwsh
        run: ./tools/release/check-build-output.ps1

      - name: Assert tag equals assembly version
        shell: pwsh
        run: ./tools/release/assert-version.ps1 -Tag $env:TAG -ExePath $env:EXE_PATH

      - name: Package release assets
        shell: pwsh
        run: ./tools/release/package-release.ps1 -ExePath $env:EXE_PATH -OutDir release-assets

      # Code signing is not done in v1: the launcher ships UNSIGNED. Signing is planned through
      # SignPath Foundation (https://signpath.org/) once the application is approved; see
      # Docs/code-signing-policy.md. When approved, sign here, BEFORE the packaging step above
      # (so SHA256SUMS covers the signed exe). Do not add any manifest-signing key to CI.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@<full commit sha>
      #   with: { ... }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  draft-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/DreamWeaveLauncher.exe release-assets/SHA256SUMS \
            --draft --verify-tag --title "DreamWeave Launcher $TAG" \
            --notes "Draft. Follow Docs/release-runbook.md before publishing: verify SHA256SUMS, update and sign the manifest, then publish."
