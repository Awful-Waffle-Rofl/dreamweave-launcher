name: Package release
description: >
  Builds the setup from the staged launcher files and packages the release assets. With sign=true it submits the three
  binaries to SignPath BEFORE the setup is built (the setup packs them) and the setup AFTER it is built, then verifies
  all four signatures. With sign=false nothing is signed and assert-signed.ps1 prints an UNSIGNED warning. Called only
  by .github/workflows/release.yml, which owns the job-level environment, permissions and the secret.

inputs:
  sign:
    description: "'true' to sign (SignPath configured), 'false' to ship unsigned"
    required: true
  tag:
    description: Release tag, for example v1.0.0
    required: true
  signpath-api-token:
    description: SignPath API token; a composite action cannot read secrets, so package-signed passes it in
    required: false
    default: ''
  signpath-organization-id:
    required: false
    default: ''
  signpath-project-slug:
    required: false
    default: ''
  signpath-signing-policy-slug:
    required: false
    default: ''
  signpath-artifact-config-binaries:
    description: SignPath artifact configuration slug for the three binaries
    required: false
    default: ''
  signpath-artifact-config-setup:
    description: SignPath artifact configuration slug for the setup installer
    required: false
    default: ''

runs:
  using: composite
  steps:
    # ---- Pass 1: only the three binaries the setup packs. Never any third-party file. ----
    - name: Stage the binaries to sign
      if: inputs.sign == 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path sign-in-binaries | Out-Null
        foreach ($n in 'DreamWeaveLauncher.exe', 'Launcher.Core.dll', 'DreamWeaveDecalLaunch.exe') {
          Copy-Item -LiteralPath (Join-Path 'launcher-bin' $n) -Destination sign-in-binaries -Force
        }

    # upload-artifact zips by default, so the SignPath artifact configuration for this pass has a <zip-file> root.
    - name: Upload the unsigned binaries
      if: inputs.sign == 'true'
      id: upload-binaries
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: unsigned-binaries
        path: sign-in-binaries
        if-no-files-found: error

    # The timeout covers a human approving the request in SignPath (SignPath Foundation requires a manual approval
    # per release); the default of 600 seconds would fail the job while it waits. The job's timeout-minutes matches.
    - name: Sign launcher binaries (SignPath)
      if: inputs.sign == 'true'
      uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ inputs.signpath-api-token }}
        organization-id: ${{ inputs.signpath-organization-id }}
        project-slug: ${{ inputs.signpath-project-slug }}
        signing-policy-slug: ${{ inputs.signpath-signing-policy-slug }}
        artifact-configuration-slug: ${{ inputs.signpath-artifact-config-binaries }}
        github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signed-binaries

    - name: Replace the binaries with the signed ones
      if: inputs.sign == 'true'
      shell: pwsh
      run: ./tools/release/apply-signed.ps1 -SignedDir signed-binaries -TargetDir launcher-bin -Name DreamWeaveLauncher.exe, Launcher.Core.dll, DreamWeaveDecalLaunch.exe

    # Inno Setup 6 is preinstalled on the Windows runners; the script logs the exact version it used.
    - name: Build setup installer
      shell: pwsh
      run: ./tools/release/build-setup.ps1 -ExePath launcher-bin/DreamWeaveLauncher.exe -OutDir setup-out

    # ---- Pass 2: the setup itself. Its embedded uninstaller is not signed (see Docs/code-signing-policy.md). ----
    - name: Upload the unsigned setup
      if: inputs.sign == 'true'
      id: upload-setup
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: unsigned-setup
        path: setup-out/DreamWeaveLauncher-Setup.exe
        if-no-files-found: error

    - name: Sign setup installer (SignPath)
      if: inputs.sign == 'true'
      uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ inputs.signpath-api-token }}
        organization-id: ${{ inputs.signpath-organization-id }}
        project-slug: ${{ inputs.signpath-project-slug }}
        signing-policy-slug: ${{ inputs.signpath-signing-policy-slug }}
        artifact-configuration-slug: ${{ inputs.signpath-artifact-config-setup }}
        github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: signed-setup

    - name: Replace the setup with the signed one
      if: inputs.sign == 'true'
      shell: pwsh
      run: ./tools/release/apply-signed.ps1 -SignedDir signed-setup -TargetDir setup-out -Name DreamWeaveLauncher-Setup.exe

    - name: Assert signatures (or warn that the release is unsigned)
      shell: pwsh
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        ./tools/release/assert-signed.ps1 -Enabled $env:SIGN -Path `
          launcher-bin/DreamWeaveLauncher.exe, launcher-bin/Launcher.Core.dll, launcher-bin/DreamWeaveDecalLaunch.exe, setup-out/DreamWeaveLauncher-Setup.exe

    - name: Assert tag equals assembly and setup version
      shell: pwsh
      env:
        TAG: ${{ inputs.tag }}
      run: |
        $found = Get-ChildItem setup-out -Filter 'DreamWeaveLauncher-Setup.exe' | Select-Object -First 1
        if (-not $found) { throw 'No setup exe found in setup-out' }
        ./tools/release/assert-version.ps1 -Tag $env:TAG -ExePath launcher-bin/DreamWeaveLauncher.exe -SetupPath $found.FullName

    # SHA256SUMS is computed here, after the setup is signed, so it covers the signed file.
    - name: Package release assets
      shell: pwsh
      run: |
        $found = Get-ChildItem setup-out -Filter 'DreamWeaveLauncher-Setup.exe' | Select-Object -First 1
        if (-not $found) { throw 'No setup exe found in setup-out' }
        ./tools/release/package-release.ps1 -SetupPath $found.FullName -OutDir release-assets

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-assets
        path: release-assets
        if-no-files-found: error
